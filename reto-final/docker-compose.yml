services:
  # ── Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: reto_final_db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d reto_final_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8081:80"
    depends_on:
      postgres:
        condition: service_healthy
  # ── Cache ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
  # ── Messaging ─────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: appuser
      RABBITMQ_DEFAULT_PASS: secret
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  # ── Services ──────────────────────────────────────────────────
  exchange-ms:
    build: ./exchange-ms
    container_name: exchange-ms
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: reto_final_db
      DB_USER: appuser
      DB_PASSWORD: secret
      DB_SCHEMA: exchange
      RABBITMQ_URL: amqp://appuser:secret@rabbitmq:5672
      COLLECTION_MS_URL: http://collection-ms:3002
      INVENTORY_MS_URL: http://inventory-ms:3003
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  collection-ms:
    build: ./collection-ms
    container_name: collection-ms
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: reto_final_db
      DB_USER: appuser
      DB_PASSWORD: secret
      DB_SCHEMA: collection
      RABBITMQ_URL: amqp://appuser:secret@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  inventory-ms:
    build: ./inventory-ms
    container_name: inventory-ms
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: reto_final_db
      DB_USER: appuser
      DB_PASSWORD: secret
      DB_SCHEMA: inventory
    depends_on:
      postgres:
        condition: service_healthy
  # ── Java services ─────────────────────────────────────────────
  registro-lamina:
    build:
      context: ./registro-lamina
      dockerfile: Dockerfile
    container_name: registro-lamina
    ports:
      - "8080:8080"
    environment:
      # Overrides application-dev.yml datasource (localhost → postgres container)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reto_final_db?sslmode=disable&currentSchema=public
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: secret
      # Matches ${REDIS_HOST:localhost} placeholder in application.yml
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  # ── Observability ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # === AQUÍ DEBÍA IR METIDO, CON LOS MISMOS ESPACIOS ===
  app:
    build: ./registro-lamina
    container_name: microservicio-registro
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/reto_final_db
      - SPRING_DATASOURCE_USERNAME=appuser
      - SPRING_DATASOURCE_PASSWORD=secret
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  grafana_data:
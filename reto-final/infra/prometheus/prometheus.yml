global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"
  # Java services (existing — do not change)
  - job_name: "registro-lamina"
    metrics_path: "/registro-lamina/actuator/prometheus"
    static_configs:
      - targets: ["registro-lamina:8080"]   # contenedor en red Docker
  - job_name: "admin-api"
    metrics_path: "/admin-api/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          app: "admin-api"
          service: "context-scorer"
  # Node.js services (new)
  - job_name: "exchange-ms"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["exchange-ms:3001"]
        labels:
          app: "exchange-ms"
          service: "saga-orchestrator"
  - job_name: "collection-ms"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["collection-ms:3002"]
        labels:
          app: "collection-ms"
          service: "stickers-album"
  - job_name: "inventory-ms"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["inventory-ms:3003"]
        labels:
          app: "inventory-ms"
          service: "inventory-crud"